name: gdluxx

services:
  gdluxx:
    image: ghcr.io/gdluxx/gdluxx:latest
    container_name: gdluxx
    ports:
      - '7755:7755'
    volumes:
      - ./data:/app/data
      # - /host/path/to/downloads:/app/downloads
    environment:
      - 'AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET must be set - generate one with: openssl rand -hex 32}'
      - ORIGIN=${ORIGIN:-http://localhost:7755}
      - USE_SECURE_COOKIES=${USE_SECURE_COOKIES:-}
      - GDLUXX_GDL_POLICY=${GDLUXX_GDL_POLICY:-}
      # Only behind a reverse proxy. See docs/advanced/reverse-proxy.md
      - TRUSTED_PROXY_HEADER=${TRUSTED_PROXY_HEADER:-}
      # - DOWNLOAD_PATH=/app/downloads
    restart: unless-stopped
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 3s
